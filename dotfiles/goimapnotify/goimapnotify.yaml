---
configurations:
    -
        host: imap.migadu.com
        port: 993
        tls: true
        tlsOptions:
            rejectUnauthorized: false
            starttls: false
        idleLogoutTimeout: 15
        alias: maikkoehler.eu
        usernameCMD: oo7-cli lookup Title=imap.migadu.com | grep -oP '"UserName":\s*"\K[^"]+'
        passwordCMD: oo7-cli lookup --secret-only Title=imap.migadu.com
        xoAuth2: false
        boxes:
            -
                mailbox: INBOX
                onNewMail: "notify-send --icon thunderbird --app-name Thunderbird mail@maikkoehler.eu 'Ungelesene Nachricht(en) im Posteingang'"
                onChangedMail: SKIP
                onChangedMailPost: SKIP
                onNewMailPost: SKIP
