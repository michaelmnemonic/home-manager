# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# HYPRPAPER CONFIGURATION.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# Disable the Hyprland splash text rendered over the wallpaper
splash = false

# Keep IPC enabled for fast wallpaper switches via hyprctl
ipc = true

# Wallpaper for every monitor
wallpaper {
    monitor = *
    path = ~/.config/hypr/wallpaper.jpg
    fit_mode = cover
}
